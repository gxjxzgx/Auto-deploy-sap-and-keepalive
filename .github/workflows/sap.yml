name: SAP

on:
  workflow_dispatch:  # 只允许手动触发
    inputs:
      region:
        description: '选择部署区域'
        required: true
        default: 'US(free)'
        type: choice
        options:
          - SG(free)  # azure新加披
          - US(free)  # aws美国
      app_name:
        description: '应用名称（可选，留空则自动生成）'
        required: false
        default: ''
      uuid:
        description: 'UUID（可选，留空则使用仓库 Secrets 中的 UUID，或运行时随机生成）'
        required: false
        default: ''
      argo_domain:
        description: 'Argo 固定隧道域名（可选，留空则使用仓库 Secrets 中的 ARGO_DOMAIN）'
        required: false
        default: ''
      argo_auth:
        description: 'Argo 隧道 Token/JSON（可选，留空则使用仓库 Secrets 中的 ARGO_AUTH）'
        required: false
        default: ''
      argo_port:
        description: 'Argo 本地监听端口'
        required: false
        default: '8001'

env:
  MEMORY: 256M
  DISK: 300M

jobs:
  deploy-app:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install CF CLI
      run: |
        wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
        echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
        sudo apt-get update
        sudo apt-get install -y cf8-cli

    - name: Determine CF API endpoint and app name
      run: |
        # 设置API端点和生成随机字符串
        RANDOM_STR=$(head /dev/urandom | tr -dc 'a-z' | head -c 6)

        case "${{ github.event.inputs.region }}" in
          "SG(free)")
            echo "CF_API=https://api.cf.ap21.hana.ondemand.com" >> $GITHUB_ENV
            echo "APP_NAME=free-sg$RANDOM_STR" >> $GITHUB_ENV
            ;;
          "US(free)")
            echo "CF_API=https://api.cf.us10-001.hana.ondemand.com" >> $GITHUB_ENV
            echo "APP_NAME=free-us$RANDOM_STR" >> $GITHUB_ENV
            ;;
        esac

        # 如果用户提供了应用名称，则使用用户提供的
        if [ -n "${{ github.event.inputs.app_name }}" ]; then
          echo "APP_NAME=${{ github.event.inputs.app_name }}" >> $GITHUB_ENV
          FINAL_APP_NAME="${{ github.event.inputs.app_name }}"
        else
          FINAL_APP_NAME=$(grep APP_NAME= $GITHUB_ENV | tail -1 | cut -d= -f2)
        fi

        echo "使用API端点: $(grep CF_API= $GITHUB_ENV | tail -1 | cut -d= -f2)"
        echo "应用名称: $FINAL_APP_NAME"

    - name: Login to Cloud Foundry
      run: |
        cf login -a ${{ env.CF_API }} -u "${{ secrets.EMAIL }}" -p "${{ secrets.PASSWORD }}"

        # 获取组织列表
        ORG=$(cf orgs | sed -n '4p')
        echo "Selected org: $ORG"
        echo "ORG=$ORG" >> $GITHUB_ENV

        # 获取空间列表
        SPACE=$(cf spaces | sed -n '4p')
        echo "Selected space: $SPACE"
        echo "SPACE=$SPACE" >> $GITHUB_ENV

        # 使用获取的组织和空间重新登录
        cf login -a ${{ env.CF_API }} -u "${{ secrets.EMAIL }}" -p "${{ secrets.PASSWORD }}" -o "$ORG" -s "$SPACE"

    - name: Deploy application
      run: |
        # 改为 buildpack 部署方式，运行仓库根目录下的 index.js
        if cf push ${{ env.APP_NAME }} \
            -b nodejs_buildpack \
            -m ${{ env.MEMORY }} \
            -k ${{ env.DISK }} \
            --health-check-type port \
            -c "node index.js" \
            --no-start; then
          echo "Push successful, setting environment variables before first start"
        else
          cf delete ${{ env.APP_NAME }} -r -f
          echo "伙计,没资源了,部署失败,请明天早上8:20至9:00再尝试部署,已清理失败部署残留"
          exit 1
        fi

    - name: Set environment variables
      run: |
        # 与 index.js 脚本实际读取的环境变量名保持一致
        cf set-env ${{ env.APP_NAME }} NAME "SAP-${{ github.event.inputs.region }}"
        cf set-env ${{ env.APP_NAME }} UUID "${{ github.event.inputs.uuid != '' && github.event.inputs.uuid || secrets.UUID }}"

        # Argo 隧道
        cf set-env ${{ env.APP_NAME }} ENABLE_ARGO "true"
        cf set-env ${{ env.APP_NAME }} ARGO_DOMAIN "${{ github.event.inputs.argo_domain != '' && github.event.inputs.argo_domain || secrets.ARGO_DOMAIN }}"
        cf set-env ${{ env.APP_NAME }} ARGO_AUTH "${{ github.event.inputs.argo_auth != '' && github.event.inputs.argo_auth || secrets.ARGO_AUTH }}"
        cf set-env ${{ env.APP_NAME }} ARGO_PORT "${{ github.event.inputs.argo_port }}"

        # 订阅相关
        cf set-env ${{ env.APP_NAME }} SUB_PATH "${{ secrets.SUB_PATH || 'sub' }}"
        cf set-env ${{ env.APP_NAME }} CFIP "${{ secrets.CFIP || 'cf.877774.xyz' }}"
        cf set-env ${{ env.APP_NAME }} CFPORT "${{ secrets.CFPORT || '443' }}"

        # Telegram 通知
        cf set-env ${{ env.APP_NAME }} CHAT_ID "${{ secrets.CHAT_ID }}"
        cf set-env ${{ env.APP_NAME }} BOT_TOKEN "${{ secrets.BOT_TOKEN }}"

        # cfsm-agent 探针上报（如果不用可以不填这三项，脚本会自动跳过探针）
        # PROBE_ID 与上面实际部署使用的 UUID 保持一致（优先手动输入，否则用 Secrets）
        cf set-env ${{ env.APP_NAME }} PROBE_ID "${{ github.event.inputs.uuid != '' && github.event.inputs.uuid || secrets.UUID }}"
        cf set-env ${{ env.APP_NAME }} PROBE_SECRET "${{ secrets.PROBE_SECRET }}"
        cf set-env ${{ env.APP_NAME }} PROBE_URL "${{ secrets.PROBE_URL }}"

        # 可选：从 .env 文件补充其他自定义环境变量（如 REALITY_PORT、HY2_PORT、S5_PORT、WS_PORT、CDN_DOMAIN 等）
        if [ -f .env ]; then
          while IFS= read -r line; do
            if [[ ! "$line" =~ ^# ]] && [[ -n "$line" ]]; then
              IFS='=' read -r key value <<< "$line"
              cf set-env ${{ env.APP_NAME }} "$key" "$value"
            fi
          done < .env
        fi

    - name: Start application
      run: |
        cf start ${{ env.APP_NAME }}

    - name: Verify deployment
      run: |
        cf app ${{ env.APP_NAME }}
        echo "Deployment completed successfully!"

    - name: 详细部署信息
      run: |
        echo "🚀 部署完成！详细信息如下："
        echo "区域(Region): ${{ github.event.inputs.region }}"
        echo "组织(ORG): ${{ env.ORG }}"
        echo "空间(SPACE): ${{ env.SPACE }}"
        echo "应用名称(App Name): ${{ env.APP_NAME }}"

        # 获取应用路由
        ROUTE=$(cf app ${{ env.APP_NAME }} | grep "routes:" | awk '{print $2}')
        if [ -n "$ROUTE" ]; then
          echo "应用 URL (APP_URL): https://$ROUTE"
          echo "订阅地址 (Subscription): https://$ROUTE/${{ secrets.SUB_PATH || 'sub' }}"
        else
          echo "⚠️ 未找到应用路由，请检查部署状态。"
        fi
